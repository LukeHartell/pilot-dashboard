<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Pilot Dashboard</title>
    <link rel="icon" href="assets/img/favicon.ico" />
  </head>
  <body>
    <script>
      (function () {
        const pages = new Set([
          "preflight",
          "flight",
          "logbook",
          "planes",
          "user",
          "edit-user",
          "login",
          "signup",
          "add-flight",
          "add-flights",
          "add-plane",
          "about",
          "privacy-notice",
          "terms-of-service",
          "request-all-data",
        ]);

        const segments = window.location.pathname
          .split("/")
          .map((s) => s.trim())
          .filter(Boolean);

        // Root -> preflight
        if (segments.length === 0 || segments[segments.length - 1] === "index.html") {
          window.location.replace("/preflight");
          return;
        }

        // Find the first segment that matches a known page
        const target = segments.find((s) => pages.has(s.replace(/\.html$/i, "")));
        if (target) {
          const slug = target.replace(/\.html$/i, "");
          window.location.replace(`/${slug}.html`);
        }
      })();
    </script>
  </body>
</html>
